<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Email verified · Live In The End</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Noto Serif SC',serif;
  background:linear-gradient(180deg,#f0ecd8 0%,#e4ecc8 25%,#d0e4b8 55%,#b8d8a0 80%,#a0cc90 100%);
  color:#3a4a2a;line-height:1.9;min-height:100vh;
}
.wrap{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top,44px) + 24px) 24px 60px;}
h1{font-size:26px;margin-bottom:6px;color:#3a4a2a;}
.updated{font-size:13px;color:#7a8868;margin-bottom:32px;}
h2{font-size:17px;margin:28px 0 10px;color:#3a4a2a;border-bottom:1px solid rgba(120,160,90,0.3);padding-bottom:6px;}
p,li{font-size:14.5px;color:#4a5a3a;margin-bottom:8px;}
ul{padding-left:20px;margin-bottom:10px;}
.note{background:rgba(232,176,74,0.15);border-radius:10px;padding:14px 16px;font-size:13.5px;color:#7a5a28;margin:20px 0;line-height:1.8;}
.back{display:inline-block;margin-bottom:20px;font-size:14px;color:#7a8868;text-decoration:none;}
</style>
<script>(function(){var q=new URLSearchParams(location.search).get('lang');var l=q||((navigator.language||'').toLowerCase().indexOf('zh')===0?'zh':'en');document.documentElement.lang=l;})();</script>
<style>html[lang="en"] .zh{display:none;} html:not([lang="en"]) .en{display:none;}
.langsw{text-align:right;font-size:13px;margin-bottom:12px;}.langsw a{color:#7a8868;margin-left:10px;}</style>
</head>
<body>
<div class="wrap" style="text-align:center;padding-top:18vh;">
<div class="en">
  <div style="font-size:52px;margin-bottom:16px;">✅</div>
  <h1>Email verified</h1>
  <p>Your Live In The End account is ready.<br>Go back to the app and tap <strong>“I've verified — log in”</strong>.</p>
</div>
<div class="zh">
  <div style="font-size:52px;margin-bottom:16px;">✅</div>
  <h1>邮箱验证成功</h1>
  <p>你的 Live In The End 账号已经可以使用了。<br>请回到 App，点<strong>「我已完成验证，登录」</strong>。</p>
</div>
</div>
</body>
</html>
