<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>重置密码 — Freed</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400&family=Noto+Sans+SC:wght@300;400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { margin:0; padding:0; width:100%; min-height:100vh; background:linear-gradient(160deg,#c2ecf8 0%,#4aaed8 45%,#0d4870 100%); }
body { display:flex; align-items:center; justify-content:center; padding:24px; }

.card {
  width:100%; max-width:340px;
  padding:32px 26px 26px;
  border-radius:28px;
  background:radial-gradient(circle at 30% 25%, rgba(255,255,255,0.88) 0%, rgba(230,245,255,0.72) 30%, rgba(180,220,250,0.60) 60%, rgba(140,200,240,0.55) 100%);
  box-shadow: inset 0 0 30px rgba(180,220,255,0.55), inset 0 0 8px rgba(255,255,255,0.60), 0 12px 40px rgba(10,50,100,0.35);
  backdrop-filter:blur(6px);
}
.title {
  text-align:center;
  font-family:'Noto Serif SC',serif;
  font-size:1.05rem; font-weight:400;
  color:#0e3560; letter-spacing:0.15em;
  margin-bottom:6px;
}
.subtitle {
  text-align:center;
  font-family:'Noto Sans SC',sans-serif;
  font-size:0.68rem; color:rgba(20,60,110,0.62);
  margin-bottom:22px; letter-spacing:0.04em;
}
.input {
  width:100%; padding:11px 14px; margin-bottom:12px;
  border:1.5px solid rgba(120,170,220,0.40); border-radius:12px;
  background:rgba(255,255,255,0.75);
  font-family:'Noto Sans SC',sans-serif; font-size:0.85rem; color:#0e2840;
  outline:none; transition:border-color 0.2s, background 0.2s;
}
.input:focus { border-color:rgba(80,140,210,0.85); background:rgba(255,255,255,0.92); }
.input::placeholder { color:rgba(20,60,110,0.40); }
.btn {
  width:100%; padding:12px 0; margin-top:6px;
  border:none; border-radius:14px;
  background:linear-gradient(135deg,#4a9fd4,#2a7abf);
  color:#fff; font-family:'Noto Serif SC',serif;
  font-size:0.92rem; letter-spacing:0.1em;
  cursor:pointer; box-shadow:0 4px 16px rgba(42,122,191,0.35);
  transition:transform 0.15s, opacity 0.2s;
}
.btn:active { transform:scale(0.97); }
.btn:disabled { opacity:0.55; cursor:not-allowed; }
.msg {
  margin-top:12px; padding:8px 12px; border-radius:10px;
  font-family:'Noto Sans SC',sans-serif; font-size:0.75rem;
  text-align:center; display:none;
}
.msg.error { display:block; background:rgba(220,80,80,0.15); color:#a02020; border:1px solid rgba(220,80,80,0.30); }
.msg.success { display:block; background:rgba(80,180,130,0.18); color:#1a6f48; border:1px solid rgba(80,180,130,0.35); }
.back { display:block; text-align:center; margin-top:16px; font-family:'Noto Sans SC',sans-serif; font-size:0.72rem; color:rgba(20,60,110,0.55); cursor:pointer; text-decoration:none; }
.back:hover { color:rgba(20,60,110,0.85); }
</style>
</head>
<body>
<div class="card">
  <div class="title">Freed</div>
  <div class="subtitle" id="subtitle">设置新密码</div>

  <div id="form-reset">
    <input type="password" id="pw1" class="input" placeholder="新密码（至少 6 位）" autocomplete="new-password" />
    <input type="password" id="pw2" class="input" placeholder="再次输入新密码" autocomplete="new-password" />
    <button class="btn" id="submit-btn" onclick="doReset()">确认修改</button>
    <div class="msg" id="msg"></div>
  </div>

  <div id="form-done" style="display:none;">
    <div class="msg success" style="display:block;">密码已更新 ✨<br>请返回登录</div>
  </div>

  <a class="back" href="index.html">← 返回首页</a>
</div>

<script>
const SUPABASE_URL = 'https://ryoaxziysgdkjcjiuqti.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ5b2F4eml5c2dka2pjaml1cXRpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM1MDg2MDAsImV4cCI6MjA4OTA4NDYwMH0.ORG_8Ue8LjYfReMvKo1iQOFNGN7fcTz1_fMs8Gq1Kds';

const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: {
    persistSession: true,
    autoRefreshToken: true,
    storageKey: 'sb-ryoaxziysgdkjcjiuqti-auth-token',
  }
});

// Supabase 把 token 放在 URL hash 里，SDK 会自动处理
// 等 onAuthStateChange 确认 session 后才能调用 updateUser
let sessionReady = false;
supa.auth.onAuthStateChange((event, session) => {
  if (event === 'PASSWORD_RECOVERY') {
    sessionReady = true;
  }
});

function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + type;
}

async function doReset() {
  const pw1 = document.getElementById('pw1').value;
  const pw2 = document.getElementById('pw2').value;
  const btn = document.getElementById('submit-btn');

  if (!pw1 || pw1.length < 6) { showMsg('密码至少 6 位', 'error'); return; }
  if (pw1 !== pw2) { showMsg('两次密码不一致', 'error'); return; }

  btn.disabled = true;
  btn.textContent = '请稍候…';

  try {
    const { error } = await supa.auth.updateUser({ password: pw1 });
    if (error) throw error;
    document.getElementById('form-reset').style.display = 'none';
    document.getElementById('form-done').style.display = 'block';
  } catch(err) {
    let msg = err.message || '更新失败';
    if (msg.includes('same password')) msg = '新密码不能与旧密码相同';
    if (msg.includes('expired') || msg.includes('invalid')) msg = '链接已过期，请重新申请重置';
    showMsg(msg, 'error');
    btn.disabled = false;
    btn.textContent = '确认修改';
  }
}
</script>
</body>
</html>
